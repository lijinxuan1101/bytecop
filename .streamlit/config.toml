# TraceLens: Robust AI Image Detection Beyond Redistribution
# Widget internals read these; viz/app.py's CSS handles everything else.
[theme]
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
font = "sans serif"

[server]
maxUploadSize = 50
# Save the file, the browser reruns. No restart needed for app changes.
runOnSave = true

[browser]
gatherUsageStats = false
