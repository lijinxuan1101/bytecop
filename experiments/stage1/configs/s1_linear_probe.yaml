# Stage 1 - S1: Linear Probe on frozen OpenCLIP ViT-H/14
# Goal: verify OpenCLIP pretrained features already separate real vs AI-generated.
name: s1_linear_probe
backbone: clip_h

# Model
unfreeze_blocks: 0        # freeze entire backbone (linear-probe only)
proj_dim: 512
dropout: 0.1

# Data
dataset: cifake           # loaded from data/datasets/CIFAKE_images/
img_size: 224             # upsample from 32 to 224 for CLIP
augment: false            # Stage 1 uses clean images only (no degradation aug during training)

# Optimization
epochs: 10
batch_size: 128
head_lr: 1.0e-3           # only head trains, so use a comparatively large lr
backbone_lr: 1.0e-5       # unused when unfreeze_blocks=0, kept for schema uniformity
weight_decay: 0.01
grad_clip: 1.0

# DataLoader
workers: 8
