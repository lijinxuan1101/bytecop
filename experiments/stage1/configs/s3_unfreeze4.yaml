# Stage 1 - S3: Extended partial fine-tune (last 4 transformer blocks)
# Run only if S2 shows a consistent improvement over S1.
name: s3_unfreeze4
backbone: clip_h

# Model
unfreeze_blocks: 4
proj_dim: 512
dropout: 0.1

# Data
dataset: cifake
img_size: 224
augment: false

# Optimization
epochs: 10
batch_size: 128
head_lr: 1.0e-3
backbone_lr: 1.0e-5
weight_decay: 0.01
grad_clip: 1.0

# DataLoader
workers: 8
